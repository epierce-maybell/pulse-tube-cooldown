name = "N2"

# Span, Lemmon, Jacobsen, Wagner & Yokozeki, J. Phys. Chem. Ref. Data 29, 1361 (2000),
# https://srd.nist.gov/jpcrdreprint/1.1349047.pdf; IUPAC 1995.
molar_mass = 28.01348e-3

# Ideal diatomic gas; NIST WebBook (Span 2000 equation of state) gives Cp/Cv = 1.3996-1.4008 at 0.001 MPa from 63 to
# 300 K.
heat_capacity_ratio = 1.4

# Langmuir adsorption on activated carbon, fit at 298-413 K: Schell, Casas, Pini & Mazzotti, Adsorption 18, 49 (2012),
# N2 on Chemviron AP3-60. Energy E = -B and prefactor A = 7.83e-3 1/MPa from Table 4; capacity 5.14 mmol/g at 25 C, the
# coldest fit, from Table 2.
adsorption_energy = 9535.0
adsorption_constant = 7.83e-9
adsorption_capacity = 5.14

[accommodation_coeff]
form = "table"
table = [[63.151, 0.80], [320.0, 0.80]]
range = [63.151, 320.0]
source = "Trott, Rader, Castaneda, Torczynski & Gallis, SAND2006-6432C (2006), https://www.osti.gov/servlets/purl/1264272; N2 on 304 stainless steel at 288-308 K, 0.80 +/- 0.02, held constant at lower temperatures"

# Dilute-gas thermal conductivity in W/(m K).
[thermal_conductivity]
form = "table"
table = [
    [63.151, 0.0056011], [65, 0.0057895], [70, 0.0062972], [75, 0.0068023], [80, 0.0073044], [85, 0.0078031],
    [90, 0.0082983], [95, 0.0087898], [100, 0.0092775], [110, 0.010241], [120, 0.011189], [130, 0.012121],
    [140, 0.013037], [150, 0.013938], [160, 0.014825], [170, 0.015697], [180, 0.016555], [190, 0.017399],
    [200, 0.018231], [210, 0.01905], [220, 0.019857], [230, 0.020653], [240, 0.021438], [250, 0.022212],
    [260, 0.022976], [270, 0.02373], [280, 0.024474], [290, 0.02521], [300, 0.025936], [310, 0.026654],
    [320, 0.027364],
]
range = [63.151, 320.0]
source = "Lemmon & Jacobsen, Int. J. Thermophys. 25, 21 (2004), https://trc.nist.gov/refprop/FAQ/NAO.PDF; dilute-gas correlation, Eqs. 2 and 5, evaluated at the tabulated temperatures; uncertainty about 2%"

[saturation_pressure]
form = "wagner"
critical_temperature = 126.192
critical_pressure = 3.3958e6
coefficients = [-6.12445284, 1.26327220, -0.765910082, -1.77570564]
exponents = [1.0, 1.5, 2.5, 5.0]
range = [63.151, inf]
source = "Span, Lemmon, Jacobsen, Wagner & Yokozeki, J. Phys. Chem. Ref. Data 29, 1361 (2000), Sec. 2.6, ancillary vapor-pressure equation from Nowak et al. (1997)"
