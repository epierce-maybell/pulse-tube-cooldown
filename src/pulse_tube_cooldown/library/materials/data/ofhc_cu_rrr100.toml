name = "OFHC Cu RRR100"

# Density in kg/m^3 at 20 C: CRC Handbook of Chemistry and Physics.
density = 8960.0

# Specific heat in J/(kg K), independent of RRR.
[specific_heat]
form = "log_poly"
coefficients = [-1.91844, -0.15973, 8.61013, -18.996, 21.9661, -12.7328, 3.54322, -0.3797, 0.0]
range = [2.0, 300.0]
source = "NIST Cryogenic Material Properties, OFHC Copper (UNS C10100/C10200), revised 2010-02-03, https://trc.nist.gov/cryogenics/materials/OFHC%20Copper/OFHC_Copper_rev1.htm; fit error 10% below 15 K, 5% above"

[specific_heat.low_temperature]
source = "Furukawa, Saba and Reilly (1968), NSRDS-NBS 18, Table 2, p. 20, https://nvlpubs.nist.gov/nistpubs/Legacy/NSRDS/nbsnsrds18.pdf; evaluated copper heat capacity 0.00177 and 0.00337 J/(mol K) at 2 and 3 K, divided by the source molar mass 0.0635400 kg/mol"
join_temperature = 4.0
table = [[2.0, 0.02785646836638338], [3.0, 0.05303745672017627]]

# Thermal conductivity in W/(m K) for RRR = 100.
[thermal_conductivity]
form = "rational_poly"
coefficients = [2.2154, -0.47461, -0.88068, 0.13871, 0.29505, -0.02043, -0.04831, 0.001281, 0.003207]
range = [2.0, 300.0]
source = "NIST Cryogenic Material Properties, OFHC Copper (UNS C10100/C10200), RRR = 100, revised 2010-02-03, https://trc.nist.gov/cryogenics/materials/OFHC%20Copper/OFHC_Copper_rev1.htm; fit error 1%"

[thermal_conductivity.low_temperature]
source = "Hust and Lankford (1984), NBSIR 84-3007, Table 2.4.1, p. 28, https://nvlpubs.nist.gov/nistpubs/Legacy/IR/nbsir84-3007.pdf; calculated annealed bulk copper conductivity, RRR=100 defined using ice-point and residual resistivity; correlation represents primary measurements within 15%"
join_temperature = 4.0
table = [[2.0, 312.0], [3.0, 468.0]]
