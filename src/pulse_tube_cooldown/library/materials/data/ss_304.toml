name = "304 SS"

# Density in kg/m^3 at room temperature: ASM Handbook, Vol. 1, AISI 304.
density = 8000.0

# Specific heat in J/(kg K).
[specific_heat]
form = "log_poly"
coefficients = [22.0061, -127.5528, 303.647, -381.0098, 274.0328, -112.9212, 24.7593, -2.239153, 0.0]
range = [2.0, 300.0]
source = "NIST Cryogenic Material Properties, 304 Stainless (UNS S30400), https://trc.nist.gov/cryogenics/materials/304Stainless/304Stainless_rev.htm; data 4-300 K, fit error 5%"

[specific_heat.low_temperature]
source = "Ho, King and Fickett (1978), Low temperature specific heat of two stainless steels, Cryogenics 18, 296-298, Table 2; reproduced in NBSIR 79-1609, p. 200, https://nvlpubs.nist.gov/nistpubs/Legacy/IR/nbsir79-1609.pdf; AISI 304 specimen measured 2-20 K, uncertainty within 1%"
join_temperature = 4.0
table = [[2.0, 0.936], [3.0, 1.41]]

# Thermal conductivity in W/(m K).
[thermal_conductivity]
form = "log_poly"
coefficients = [-1.4087, 1.3982, 0.2543, -0.6260, 0.2334, 0.4256, -0.4658, 0.1650, -0.0199]
range = [1.0, 300.0]
source = "NIST Cryogenic Material Properties, 304 Stainless (UNS S30400), https://trc.nist.gov/cryogenics/materials/304Stainless/304Stainless_rev.htm; data 4-300 K, equation 1-300 K, fit error 2%"
