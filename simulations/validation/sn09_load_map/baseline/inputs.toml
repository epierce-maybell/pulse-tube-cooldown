# Inputs to fit.py: SN09's head (S0009) on the test stand, run as one F-70H for its May 2026 load map.
head = "PT1.1"
load_map = "load_map_2026-05-14.dat"
cooldown = "cooldown_2026-05-14.dat"

frequency = 1.0                # Hz
fill_pressure = 1.811325e6     # Pa, absolute
displacement_rate = [5.72e-3]  # m^3/s, per compressor
relief_swing = [1.93e6]        # Pa, per compressor
warm_volume = 2.9635e-2        # m^3
waveform_factor = 1.0

[initial]
packing_constant = [0.13, 0.1]
conductance = [1.025e-10, 4.4e-11]  # W/Pa^2
exchanger_effectiveness = 0.25  # Stage-2 cold-exchanger coupling estimate: 1 K/W at the May profiles' 3.3 to 5.9 W/K capacity rate

[sources]
frequency = "pt_performance_overview_2026-10-30.pdf, S0009 final valve settings: f = 1.0 Hz"
fill_pressure = "pt_performance_overview_2026-10-30.pdf, S0009 initial filling pressure 17.1 bar, taken as gauge, plus 101325 Pa"
displacement_rate = "data/compressors.md: swept rate of the Copeland ZR72KC frame at 3500 rpm, an upper bound"
relief_swing = "data/compressors.md: middle of the 18.6 to 20.0 bar read from an FP1 F-70H at its relief cap"
warm_volume = "Two 20 m DN25 flexlines, taken as 25 mm bore, and two 5 L buffers"
waveform_factor = "Fixed at 1 and absorbed into the conductances"
warm_temperature = "first TPR reading of the paired cooldown"

[search]
ratio_bounds = [4.1e-10, 5.2e-10]  # C_2 / a_2, W/Pa^2
profile_seed = "cooling_seed.json"  # Derived from scan_cold_down.json at r = 4.3724263611058446e-10.
