head = "PT1.1"
parameters = "parameters.toml"
geometry = "data/heads/pt1_1/geometry.csv"
fill_pressure = 1.811325e6  # Pa absolute; 17.1 bar gauge plus atmosphere
warm_volume = 2.9635e-2     # m^3; two 20 m DN25 lines and two 5 L buffers
displacement_rate = 5.72e-3 # m^3/s per compressor
relief_swing = 1.93e6      # Pa per compressor
waveform_factor = 1.0
wall_material = "304 SS"

[solver]
solver = "Radau"
save_every = 30.0  # s
rtol = 1e-5
atol = 1e-6       # K
max_step = 60.0   # s

[inventory]
stage_1 = [["OFHC Cu RRR100", 1.5838], ["Al 6061-T6", 0.4536], ["304 SS", 0.0709]]
stage_2 = [["304 SS", 0.4218], ["OFHC Cu RRR100", 0.0397]]

[runs.may]
cooldown = "cooldown_2026-05-14.dat"
compressors = 1
end_exclusive = "2026-05-14T14:19:17"

[runs.august]
cooldown = "cooldown_2026-08-24.dat"
load_map = "load_map_2026-08-25.dat"
compressors = 2

[sources]
parameters = "Snapshot of ../sn09_load_map/candidate_parameters.toml on 2026-11-02; May map only; may_fit_snapshot.json"
drive = "Snapshot of ../sn09_load_map/inputs.toml; TASKS 5.4; waveform factor absorbed into conductances"
inventory = "TASKS 5.1; copper 0.3928 + 1.191 kg on stage 1; Al alloy assumption in TASKS 2.13"
wall_material = "geometry.csv; Falter 2024; 304 grade and 0.5 mm wall estimated"
stand_links = "TASKS 2.5: tube walls only to match May fit; adding MLI radiation requires refitting"
initial_state = "First T3 reading (logged TPR) as assumed room-temperature proxy for uniform initial state and fixed warm flange, matching the fit's convention; T3 is mounted on the pulse tube"
time_origin = "First logged timestamp; no fitted time shift; May appended run excluded per data/test_stand.md"
august_drive = "TASKS 2.5: two compressors assumed; same lines, buffers, and fill convention as May"
comparison = "data/test_stand.md: finite T1 below 219 K, all finite T2, T3 (logged TPR) an unscored pulse-tube diagnostic; uniform 2 s measurement cadence"
