[procedure]
source = "../../dev/cc_routines/routines/subroutines/"
until = { condition = "condensing_begins", node = "MXP", threshold = 14.0 }

[[procedure.phases]]
name = "Exchange gas"
disable = ["Gas pushing"]
until = { condition = "gas_pushing_begins", node = "CFP", threshold = 75.0 }

[[procedure.phases]]
name = "Evacuated"
disable = ["Shared exchange gas"]
until = { condition = "gas_pushing_begins", node = "CFP", threshold = 70.0 }

[[procedure.phases]]
name = "Gas pushing"
enable = ["Gas pushing"]

[simulation]
solver = "Radau"
max_time = 259200.0
save_every = 600.0
rtol = 1.0e-6
atol = 1.0e-6
initial_temperature = 300.0
fixed_boundary_nodes = ["Fixed boundary"]

[validation]
measured = "data/fp1/cooldown.toml"
baseline = "simulations/validation/legacy_baseline/fp1_generous.nc"
