[[procedure.phases]]
name = "Exchange gas"
disable = ["Gas pushing"]
until = { condition = "gas_pushing_begins", node = "CFP", threshold = 75.0 }

[[procedure.phases]]
name = "Evacuated"
disable = ["Shared exchange gas"]
until = { condition = "gas_pushing_begins", node = "CFP", threshold = 70.0 }

[[procedure.phases]]
name = "Gas pushing"
enable = ["Gas pushing"]

[simulation]
