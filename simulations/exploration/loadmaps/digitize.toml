# Münster load-map figures to digitize, from docs/pt_performance_overview_2026-10-30.pdf, as `digitize.py` reads them.
#
# Each axis is calibrated from two gridlines given as [pixel, value]; `*_step` is the spacing of the figure's
# finest gridlines in data units, which the calibration refines against. `q1` and `q2` are the heater powers in W
# that the figure labels, ordered from low to high. A grid holds every pair of them; a sweep holds one `q1` with
# Q2 read from the x axis. `inferred` names any levels read from context rather than from a label. `ignore` boxes,
# as [T1 min, T1 max, T2 min, T2 max], drop legend markers. `crop` keeps pixel columns [start, stop) of a figure
# with two panels.

