# S0035 two-temperature feasibility screen, 2026-11-10.
serial = "S0035"
head_design = "PT1.5"
stand = "data/test_stand/test_stand.toml"
records = "simulations/validation/head_comparison/records.toml"

[law]
# Order: zero-power temperatures [K], own-stage slopes [W/K],
# power limits [W], dimensionless cross-stage strengths.
initial = [40.0, 2.3, 1.5, 0.4, 60.0, 15.0, 0.5, 0.02]
lower = [30.0, 1.7, 0.01, 0.005, 26.0, 0.6, 0.0, 0.0]
upper = [50.0, 3.2, 10.0, 2.0, 500.0, 100.0, 0.95, 0.95]

[fit]
maximum_evaluations = 200
difference_fraction = 0.001
# Each temperature block contributes its mean squared scaled residual.
cooldown_log_scales = [0.03, 0.06]
map_temperature_scales = [1.0, 0.05] # K
sample_interval = 60.0 # s

[numerics]
relative_tolerance = 1e-8
absolute_tolerance = 1e-9 # K
maximum_step = 60.0 # s
property_min_temperature = 1.0 # K; existing material endpoint continuations apply.
property_max_temperature = 400.0 # K
property_knots = 4097
