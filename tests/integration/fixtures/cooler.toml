[meta]
experiment = "Cooler integration test"
source = "A bare PT1.5 head on one compressor, with the test stand's stage masses from data/test_stand.md"

[[fridge.nodes]]
name = "Warm flange"
composition = [["OFHC Cu RRR100", 10.0]]

[[fridge.nodes]]
name = "Stage 1"
composition = [["OFHC Cu RRR100", 1.5838], ["Al 6061-T6", 0.4536], ["304 SS", 0.0709]]

[[fridge.nodes]]
name = "Stage 2"
composition = [["304 SS", 0.4218], ["OFHC Cu RRR100", 0.0397]]

[[fridge.links]]
name = "Cooler"
type = "cooler"
warm_flange = "Warm flange"
drive = "tests/integration/fixtures/cooler/drive.toml"

[[fridge.links.heads]]
name = "PT"
stages = ["Stage 1", "Stage 2"]
model = "PT1.5"
parameters = "tests/integration/fixtures/cooler/pt.toml"

[[procedure.phases]]
name = "cooldown"

[simulation]
solver = "Radau"
max_time = 600.0
save_every = 300.0
initial_temperature = 295.0
fixed_boundary_nodes = ["Warm flange"]
